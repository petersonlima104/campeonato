<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Campeonato</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- BOTÃO LOGIN -->
    <div class="text-end p-2">
      <button
        class="btn btn-outline-primary"
        data-bs-toggle="modal"
        data-bs-target="#loginModal"
      >
        Área do Administrador
      </button>
    </div>

    <!-- MODAL LOGIN -->
    <div class="modal fade" id="loginModal">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Login ADM</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input id="email" class="form-control mb-2" placeholder="Email" />
            <input
              id="password"
              type="password"
              class="form-control"
              placeholder="Senha"
            />
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary w-100" onclick="login()">
              Entrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="container mt-3">
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <button
            class="nav-link active"
            data-bs-toggle="tab"
            data-bs-target="#times"
          >
            Times
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#artilheiros"
          >
            Artilheiros
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link"
            data-bs-toggle="tab"
            data-bs-target="#assistencias"
          >
            Assistências
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#jogos">
            Jogos
          </button>
        </li>
      </ul>

      <div class="tab-content mt-3">
        <!-- TIMES -->
        <div class="tab-pane fade show active" id="times">
          <button class="btn btn-success mb-2 admin-only" onclick="novoTime()">
            ➕ Adicionar Time
          </button>

          <table class="table table-striped">
            <thead>
              <tr>
                <th>#</th>
                <th>Time</th>
                <th>P</th>
                <th>PJ</th>
                <th>VIT</th>
                <th>E</th>
                <th>DER</th>
                <th>GM</th>
                <th>GC</th>
                <th>SG</th>
                <th class="admin-only">Ações</th>
              </tr>
            </thead>
            <tbody id="listaTimes"></tbody>
          </table>
        </div>

        <!-- ARTILHEIROS -->
        <div class="tab-pane fade" id="artilheiros">
          <input
            type="text"
            id="filtroArtilheiro"
            class="form-control mb-2"
            placeholder="🔍 Buscar jogador ou time..."
            oninput="filtrarArtilheiros()"
          />
          <!-- BOTÃO ADICIONAR ARTILHEIRO -->
          <button
            class="btn btn-success mb-2 admin-only"
            onclick="novoArtilheiro()"
          >
            ➕ Adicionar Jogador
          </button>

          <table class="table table-striped">
            <thead>
              <tr>
                <th>#</th>
                <th>Jogador</th>
                <th>Time</th>
                <th>Gols</th>
                <th class="admin-only">Ações</th>
              </tr>
            </thead>
            <tbody id="listaArtilheiros"></tbody>
          </table>
        </div>

        <!-- ASSISTÊNCIAS -->
        <div class="tab-pane fade" id="assistencias">
          <input
            type="text"
            id="filtroAssistencia"
            class="form-control mb-2"
            placeholder="🔍 Buscar jogador ou time..."
            oninput="filtrarAssistencias()"
          />

          <table class="table table-striped">
            <thead>
              <tr>
                <th>#</th>
                <th>Jogador</th>
                <th>Time</th>
                <th>Assist.</th>
                <th class="admin-only">Ações</th>
              </tr>
            </thead>
            <tbody id="listaAssistencias"></tbody>
          </table>
        </div>

        <!-- JOGOS -->
        <div class="tab-pane fade" id="jogos">
          <!-- BOTÃO ADICIONAR Jogo -->
          <button class="btn btn-success mb-2 admin-only" onclick="novoJogo()">
            ➕ Adicionar Jogo
          </button>

          <table class="table table-striped">
            <thead>
              <tr>
                <th>Data</th>
                <th>Hora</th>
                <th>Mandante</th>
                <th>Visitante</th>
                <th>Placar</th>
                <th class="admin-only">Ações</th>
              </tr>
            </thead>
            <tbody id="listaJogos"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- MODAL JOGO -->
    <div class="modal fade" id="jogoModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="jogoModalTitulo">Novo Jogo</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="jogoId" />

            <div class="mb-2">
              <label>Data</label>
              <input id="jogoData" class="form-control" placeholder="dd/mm" />
            </div>

            <div class="mb-2">
              <label>Hora</label>
              <input id="jogoHora" class="form-control" placeholder="hh:mm" />
            </div>

            <div class="mb-2">
              <label>Mandante</label>
              <select id="jogoMandante" class="form-select"></select>
            </div>

            <div class="mb-2">
              <label>Visitante</label>
              <select id="jogoVisitante" class="form-select"></select>
            </div>

            <div class="mb-2">
              <label>Gols Mandante</label>
              <input id="golsMandante" type="number" class="form-control" />
            </div>

            <div class="mb-2">
              <label>Gols Visitante</label>
              <input id="golsVisitante" type="number" class="form-control" />
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancelar
            </button>
            <button class="btn btn-primary" onclick="salvarJogo()">
              Salvar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL ARILHEIRO -->
    <div class="modal fade" id="modalArtilheiro">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Artilheiro</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="artilheiroId" />

            <input
              id="artilheiroNome"
              class="form-control mb-2"
              placeholder="Nome do jogador"
            />

            <select id="artilheiroTime" class="form-select mb-2"></select>

            <input
              id="artilheiroGols"
              type="number"
              class="form-control"
              placeholder="Gols"
            />
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary w-100" onclick="salvarArtilheiro()">
              Salvar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL ASSISTÊNCIA -->
    <div class="modal fade" id="modalAssistencia">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Assistência</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="assistenciaId" />

            <input
              id="assistenciaNome"
              class="form-control mb-2"
              placeholder="Nome do jogador"
              disabled
            />

            <input
              id="assistenciaQtd"
              type="number"
              class="form-control"
              placeholder="Assistências"
            />
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary w-100" onclick="salvarAssistencia()">
              Salvar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL TIME E GRUPO -->
    <div class="modal fade" id="modalTime">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Cadastrar Time</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <input
              id="timeNome"
              class="form-control mb-2"
              placeholder="Nome do time"
            />

            <label class="fw-bold">Grupo</label>
            <select id="timeGrupo" class="form-select mb-2"></select>

            <button
              class="btn btn-sm btn-outline-secondary mb-2"
              onclick="mostrarNovoGrupo()"
            >
              ➕ Novo Grupo
            </button>

            <input
              id="novoGrupo"
              class="form-control d-none"
              placeholder="Ex: A, B, C..."
            />
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary w-100" onclick="salvarTime()">
              Salvar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/times.js"></script>
    <script type="module" src="js/jogadores.js"></script>
    <script type="module" src="js/assistencias.js"></script>
    <script type="module" src="js/jogos.js"></script>

    <!-- PATROCINADORES -->
    <section class="bg-light py-4 mt-5">
      <div class="container text-center">
        <h6 class="text-uppercase fw-bold mb-3">Patrocinadores</h6>

        <div class="d-flex flex-wrap justify-content-center gap-4">
          <img
            src="img/logo.png"
            alt="Sua Marca Aqui..."
            class="patrocinio-img"
          />
          <img
            src="img/Softnet.png"
            alt="Sua Marca Aqui..."
            class="patrocinio-img"
          />
          <img
            src="img/logo.png"
            alt="Sua Marca Aqui..."
            class="patrocinio-img"
          />
        </div>
      </div>
    </section>

    <footer class="bg-dark text-light py-3">
      <div class="container text-center small">
        © <span id="anoAtual"></span> <strong>Nome do Campeonato</strong> —
        Todos os direitos reservados.<br />
        Desenvolvido por
        <a
          href="https://softnetsystems.wuaze.com/?i=1"
          target="_blank"
          class="footer-link"
        >
          SoftNet
        </a>
      </div>
    </footer>

    <script>
      document.getElementById("anoAtual").textContent =
        new Date().getFullYear();
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then(() => console.log("Service Worker registrado"))
          .catch((err) => console.error("Erro no SW:", err));
      }
    </script>
  </body>
</html>
